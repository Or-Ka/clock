name: דיווח על באג
description: דיווח שניתן לשחזר על תקלה במוצר או בספרייה
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: תודה על הדיווח. חולשות אבטחה יש לדווח באופן פרטי לפי SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: מה קרה?
      description: תיאור קצר וברור של התקלה.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: צעדים לשחזור
      description: פרטו את הפעולות, המיקום, השעה וההגדרות הרלוונטיות.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: מה ציפיתם שיקרה?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: סביבה
      description: דפדפן, מערכת הפעלה וכתובת האתר או commit.
